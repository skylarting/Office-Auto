name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "export_summary.py"
      - "excel_mapper.py"
      - "excel_mapping_tool.py"
      - "excel_mapping_qt.py"
      - "build_qt_icon.py"
      - "assets/excel-mapper.ico"
      - "test_export_summary.py"
      - "test_excel_mapper.py"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyinstaller PySide6 Pillow openpyxl xlrd xlwt xlutils pywin32

      - name: Generate Qt application icon
        run: python build_qt_icon.py

      - name: Run tests
        run: python -m unittest -v

      - name: Build ExcelMappingQt EXE
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --icon assets/excel-mapper.ico
          --add-data "assets/excel-mapper.ico;assets"
          --name ExcelMappingQt
          excel_mapping_qt.py

      - name: Upload ExcelMappingQt EXE
        uses: actions/upload-artifact@v4
        with:
          name: ExcelMappingQt-Windows
          path: dist/ExcelMappingQt.exe
          if-no-files-found: error
