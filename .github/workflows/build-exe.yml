name: Build ExcelMappingStudio EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "excel_mapper.py"
      - "excel_mapping_qt.py"
      - "excel_mapping_smart.py"
      - "excel_mapping_studio.py"
      - "excel_sheet_viewer.py"
      - "smart_template.py"
      - "build_qt_icon.py"
      - "assets/excel-mapper.ico"
      - "test_excel_mapper.py"
      - "test_excel_mapping_qt.py"
      - "test_excel_mapping_smart.py"
      - "test_excel_mapping_studio.py"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyinstaller PySide6-Essentials Pillow openpyxl xlrd xlwt xlutils pywin32

      - name: Generate Qt application icon
        run: python build_qt_icon.py

      - name: Run tests
        run: python -m unittest -v

      - name: Build ExcelMappingStudio EXE
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --optimize 2
          --exclude-module tkinter
          --exclude-module _tkinter
          --exclude-module PySide6.QtConcurrent
          --exclude-module PySide6.QtDBus
          --exclude-module PySide6.QtNetwork
          --exclude-module PySide6.QtOpenGL
          --exclude-module PySide6.QtOpenGLWidgets
          --exclude-module PySide6.QtPrintSupport
          --exclude-module PySide6.QtSql
          --exclude-module PySide6.QtTest
          --exclude-module PySide6.QtXml
          --icon assets/excel-mapper.ico
          --add-data "assets/excel-mapper.ico;assets"
          --name ExcelMappingStudio
          excel_mapping_studio.py

      - name: Upload ExcelMappingStudio EXE
        uses: actions/upload-artifact@v4
        with:
          name: ExcelMappingStudio-Windows
          path: dist/ExcelMappingStudio.exe
          if-no-files-found: error
