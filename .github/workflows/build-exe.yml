name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "export_summary.py"
      - "test_export_summary.py"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyinstaller openpyxl

      - name: Run tests
        run: python -m unittest -v

      - name: Build EXE
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name ExcelSummary
          export_summary.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ExcelSummary-Windows
          path: dist/ExcelSummary.exe
          if-no-files-found: error
